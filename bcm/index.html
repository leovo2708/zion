<!DOCTYPE html>
<html>
  <head>
    <title>BCM</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="index.css" rel="stylesheet" />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div id="loadingOverlay">
      <div id="spinner"></div>
    </div>
    <div id="container">
      <div id="title">BCM</div>
      <div class="row">
        <label for="clock">Bây giờ là:</label>
        <span name="clock" id="clock">00:00:00</span>
      </div>
      <div class="row">
        <select name="times" id="times">
          <option class="center" value="">— Chọn —</option>
        </select>
        <button id="refresh" type="button" hidden>Refresh</button>
      </div>
      <div class="row">
        <input type="text" id="songs" placeholder="132, PL3, 211, 332, 3" />
        <button id="open" type="button">Open</button>
      </div>
      <div class="row">
        <div class="info">
          Nhấn vào <a href="https://book.watv.org/" target="_blank">đây</a> để
          đăng nhập trước khi bấm Open.
        </div>
        <div class="danger">
          Hãy chọn “Cho phép” khi trình duyệt yêu cầu quyền mở nhiều cửa sổ
        </div>
      </div>
    </div>
  </body>
</html>
